{% extends 'employees/base.html' %}

{% block content %}

<div class="card-body text-center">

<h3>
Are you sure you want to delete
<strong>{{ employee.employee_name }}</strong>?

Yes, Delete

<a href="/employees/" class="btn btn-secondary">
Cancel
</a>

</form>

</div>

</div>

{% endblock %}
